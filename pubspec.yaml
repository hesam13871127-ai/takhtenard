name: takhtenard
description: Iranian Backgammon (Nardshabaneh) Game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  riverpod: ^2.5.0
  riverpod_annotation: ^2.0.0
  
  # Game engine
  flame: ^0.20.0
  
  # Animations
  lottie: ^2.7.0
  rive: ^0.12.0
  
  # Shared preferences for offline storage
  shared_preferences: ^2.2.0
  hive: ^2.2.1
  hive_flutter: ^1.1.0
  
  # Firebase for online features
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^4.9.0
  
  # Utility
  intl: ^0.18.0
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  
  # UI enhancements
  cached_network_image: ^3.3.0
  flare_svg: ^3.0.1
  animated_theme: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true

  # Assets - Iranian themed assets will be added
  assets:
    - assets/backgrounds/iranian_table.jpg
    - assets/pieces/white_piece.png
    - assets/pieces/black_piece.png
    - assets/dice/die1.png
    - assets/dice/die2.png
    - assets/dice/die3.png
    - assets/dice/die4.png
    - assets/dice/die5.png
    - assets/dice/die6.png
    - assets/icons/double_cube.png
    - assets/icons/bar.png
    - assets/ui/login_background.jpg
    - assets/ui/home_background.jpg
    - assets/ui/story_background.jpg

  # Fonts
  fonts:
    - family: IranSans
      fonts:
        - asset: assets/fonts/iransans.ttf
    - family: IranSansBold
      fonts:
        asset: assets/fonts/iransans_bold.ttf